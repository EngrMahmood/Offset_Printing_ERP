{# Module actions only — primary tabs live in the top Printing Plates subnav. #}
<div class="plates-module-nav">
    <div class="erp-actions">
        {% if active_tab != 'queue' %}
        <a href="{% url 'printing_plates:queue' %}" class="erp-btn erp-btn-secondary"><i class="fas fa-list"></i> Plate Queue</a>
        {% endif %}
        {% if active_tab != 'requests' %}
        <a href="{% url 'printing_plates:request_list' %}" class="erp-btn erp-btn-secondary"><i class="fas fa-file-invoice"></i> All Requests</a>
        {% endif %}
        {% if active_tab != 'dashboard' %}
        <a href="{% url 'printing_plates:dashboard' %}" class="erp-btn erp-btn-secondary"><i class="fas fa-chart-line"></i> Dashboard</a>
        {% endif %}
    </div>
    <div>
        <a href="{% url 'printing_plates:request_add' %}" class="erp-btn plates-add-btn"><i class="fas fa-plus"></i> Add</a>
    </div>
</div>
