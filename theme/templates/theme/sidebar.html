<aside class="erp-sidebar" id="erp-sidebar">
    <div class="erp-sidebar-header">
        <button class="erp-icon-btn" id="erp-sidebar-toggle" type="button" aria-label="Toggle Sidebar">
            <i class="fas fa-bars"></i>
        </button>
        <span>Offset ERP</span>
    </div>

    <div class="erp-sidebar-group-title">Operations</div>
    <a href="{% url 'home' %}" class="erp-nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"><i class="fas fa-chart-line"></i><span>Dashboard</span></a>
    <a href="{% url 'planning:home' %}" class="erp-nav-link {% if request.resolver_match.app_name == 'planning' %}active{% endif %}"><i class="fas fa-calendar-check"></i><span>Planning</span></a>
    <a href="{% url 'qc:qc_home' %}" class="erp-nav-link {% if request.resolver_match.app_name == 'qc' %}active{% endif %}"><i class="fas fa-clipboard-check"></i><span>QC</span></a>
    <a href="{% url 'production_dashboard' %}" class="erp-nav-link {% if request.resolver_match.url_name == 'production_dashboard' %}active{% endif %}"><i class="fas fa-industry"></i><span>Production</span></a>
    <a href="{% url 'dispatch_records' %}" class="erp-nav-link {% if request.resolver_match.url_name == 'dispatch_records' %}active{% endif %}"><i class="fas fa-truck"></i><span>Dispatch</span></a>
    {% if nav.can_access_migration %}
    <a href="{% url 'migration:dashboard' %}" class="erp-nav-link {% if request.resolver_match.app_name == 'migration' %}active{% endif %}"><i class="fas fa-file-import"></i><span>Migration</span></a>
    {% endif %}

    <div class="erp-sidebar-group-title">Master & Reports</div>
    <a href="{% url 'master_data' %}" class="erp-nav-link {% if request.resolver_match.url_name == 'master_data' or request.resolver_match.url_name == 'machine_master_tools' %}active{% endif %}"><i class="fas fa-cogs"></i><span>Master Data</span></a>
    <a href="{% url 'production_records' %}" class="erp-nav-link {% if request.resolver_match.url_name == 'production_records' %}active{% endif %}"><i class="fas fa-history"></i><span>Production Records</span></a>
    <a href="{% url 'erp_readme' %}" class="erp-nav-link {% if request.resolver_match.url_name == 'erp_readme' %}active{% endif %}"><i class="fas fa-book"></i><span>Guides</span></a>

    <div class="erp-sidebar-footer">
        <div class="erp-signed-in-label">Signed in as</div>
        <div class="erp-signed-in-user">{{ request.user.username|default:'Guest' }}</div>
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="erp-btn erp-btn-secondary erp-btn-block">Logout</button>
        </form>
    </div>
</aside>
