version: "3.9"

# Cloud deployment stack (e.g. on the Oracle Free VM). Does not affect the
# Windows LAN server in any way — that keeps running exactly as it does today.
#
# Uses SQLite (same engine/tuning as the Windows server) rather than Postgres
# — appropriate at this scale (closed system, ~15-20 users) and lighter on
# RAM on a small free-tier VM. Set DATABASE_URL in .env instead if you later
# want to switch to Postgres (already supported, see Offset_ERP/settings.py).
#
# Copy .env.example to .env and fill in real values before first run.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      SQLITE_PATH: /data/db.sqlite3
    depends_on:
      - redis
    volumes:
      - sqlitedata:/data
      - media:/app/media
      - staticfiles:/app/staticfiles
      - backups:/app/backups
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/app/media:ro
      - staticfiles:/app/staticfiles:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  redisdata:
  sqlitedata:
  media:
  staticfiles:
  backups:
