<div class="chat-call-overlay__box">
    <div class="chat-call-overlay__title" id="chat-call-title">Calling…</div>
    <div class="chat-call-overlay__videos" id="chat-call-videos"></div>
    <div class="chat-call-overlay__actions">
        <button type="button" id="chat-call-accept-btn" class="erp-btn erp-btn-primary" hidden><i class="fas fa-phone"></i> Accept</button>
        <button type="button" id="chat-call-decline-btn" class="erp-btn erp-btn-danger"><i class="fas fa-phone-slash"></i> <span id="chat-call-decline-label">Decline</span></button>
        <button type="button" id="chat-call-mute-btn" class="erp-btn erp-btn-secondary" hidden><i class="fas fa-microphone"></i></button>
    </div>
</div>
